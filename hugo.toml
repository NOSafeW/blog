baseURL = "https://blog.nosafew.com/"
theme = "anubis2"
defaultContentLanguage = "zh"
title = "SafeW 风险档案 · 博客"
enableRobotsTXT = true

[pagination]
pagerSize = 10

[params.author]
name = "SafeW 风险档案"

[params]
description = "关于 SafeW / SafeX 安全风险的深度文章、证据与分析。"
dateFormat = "2006-01-02"
images = ["/images/og-image.png"]
mainSections = ["posts"]

[params.anubis2]
enableColorThemeSwitcher = true
colorTheme = "auto"
enableSummary = true
enableCopyCodeButton = true
enableReadMoreButton = true
openInNewTab = false
tocWordCount = 400
readNextPosts = 5
customCSS = ["css/custom.css"]
socialIcons = [
  { id = "github", url = "https://github.com/NOSafeW" },
]

[params.anubis2.services.googleanalytics]
gtag = "G-NC8FN70P89"

[markup.goldmark.renderer]
unsafe = true

[markup.highlight]
style = "catppuccin-frappe"

[taxonomies]
category = "categories"
tag = "tags"

